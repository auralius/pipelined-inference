[base]
platform = ststm32
framework = arduino

monitor_speed = 115200
upload_protocol = stlink

build_unflags =
    -Os

build_flags =
    -Os
    -ffunction-sections
    -fdata-sections
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_PROGMEM
    -D NOODLE_USE_NONE
    -D NOODLE_MAX_K=9
    -D LINK_BAUD=1000000

build_src_flags =
    -ffunction-sections
    -fdata-sections

lib_deps =
    symlink:///home/auralius/works/noodle


; ============================================================
; New Noodle full-INT8 configuration
; ============================================================

[int8]
extends = base

build_flags =
    ${base.build_flags}
    -D NOODLE_USE_INT8
    -D NOODLE_BUFFER_ARENA_INITIAL_BYTES=8192


; ============================================================
; Distributed INT8 nodes
; ============================================================

[env:node1]
extends = int8
board = blackpill_f411ce

build_flags =
    ${int8.build_flags}
    -D NODE_ID=1

build_src_filter =
    -<*>
    +<main_node1.cpp>


[env:node2]
extends = int8
board = blackpill_f411ce

build_flags =
    ${int8.build_flags}
    -D NODE_ID=2

build_src_filter =
    -<*>
    +<main_node2.cpp>


[env:node3]
extends = int8
board = blackpill_f411ce

build_flags =
    ${int8.build_flags}
    -D NODE_ID=3

build_src_filter =
    -<*>
    +<main_node3.cpp>


[env:node4]
extends = int8
board = blackpill_f411ce

build_flags =
    ${int8.build_flags}
    -D NODE_ID=4

build_src_filter =
    -<*>
    +<main_node4.cpp>


[env:node5]
extends = int8
board = blackpill_f411ce

build_flags =
    ${int8.build_flags}
    -D NODE_ID=5
    -D USE_HOST_SCORE_ACK=0

build_src_filter =
    -<*>
    +<main_node5.cpp>


; ============================================================
; Single-MCU full-INT8 baseline
; ============================================================
;
; Uses the same generated INT8 PeakNet headers as Nodes 1-5.
; A slightly larger arena is used because one MCU owns both
; 16x256 activation buffers and sigmoid uses a temporary tensor.
;
[env:single_node]
extends = base
board = blackpill_f411ce

build_flags =
    ${base.build_flags}
    -D NODE_ID=0
    -D NOODLE_USE_INT8
    -D NOODLE_BUFFER_ARENA_INITIAL_BYTES=12288
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_USE_CDC

build_src_filter =
    -<*>
    +<single_node.cpp>